name: home_tutor_app
description: A new Flutter project for Home Tutor App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3
  file_picker: ^8.0.0
  flutter_svg: ^2.0.9
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.1
  pdfx: ^2.9.2
  socket_io_client: ^2.0.3
  shared_preferences: ^2.5.3
  sensors_plus: ^5.0.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.5
  video_player: ^2.11.0
  test_cov_console: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # NOTE: Uncomment the fonts section after adding Inter font files to assets/fonts/
  # Download Inter fonts from: https://fonts.google.com/specimen/Inter
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
